<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clothing Try-On</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        .header { background: #007AFF; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .section { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background: #007AFF; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin: 5px 0; }
        .btn:hover { background: #0056CC; }
        .preview { width: 100%; height: 400px; background: #e0e0e0; border-radius: 10px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .preview img { max-width: 100%; max-height: 100%; }
        .garment-list { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .garment-item { min-width: 120px; background: #f0f0f0; padding: 10px; border-radius: 8px; text-align: center; }
        .status { color: #007AFF; margin: 10px 0; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: white; border: 2px solid #007AFF; color: #007AFF; border-radius: 8px; cursor: pointer; text-align: center; }
        .tab.active { background: #007AFF; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👔 Clothing Try-On</h1>
            <p>Prueba ropa virtualmente</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('tryon')">Probar</div>
            <div class="tab" onclick="showTab('photos')">Fotos</div>
            <div class="tab" onclick="showTab('garments')">Prendas</div>
            <div class="tab" onclick="showTab('measurements')">Medidas</div>
        </div>

        <!-- Try-On Tab -->
        <div id="tryon-tab" class="section">
            <h2>Probador Virtual</h2>
            <div class="preview" id="preview">
                <p id="preview-text">👤 No hay foto</p>
            </div>
            <div class="garment-list" id="garment-list"></div>
            <div class="status" id="status"></div>
        </div>

        <!-- Photos Tab -->
        <div id="photos-tab" class="section hidden">
            <h2>Mi Foto</h2>
            <input type="file" accept="image/*" id="photo-input" onchange="loadPhoto(event)">
            <div class="preview" style="margin-top: 15px;">
                <img id="user-photo" style="display:none;">
            </div>
            <p class="status" id="photo-status">No hay foto cargada</p>
        </div>

        <!-- Garments Tab -->
        <div id="garments-tab" class="section hidden">
            <h2>Armario</h2>
            <input type="text" id="garment-name" placeholder="Nombre de la prenda">
            <input type="text" id="garment-body" placeholder="Parte (torso/piernas/pies)">
            <input type="file" accept="image/*" id="garment-image">
            <button class="btn" onclick="addGarment()">Añadir Prenda</button>
            <div class="garment-list" id="wardrobe-list"></div>
        </div>

        <!-- Measurements Tab -->
        <div id="measurements-tab" class="section hidden">
            <h2>Mis Medidas</h2>
            <input type="number" id="height" placeholder="Altura (cm)" value="170">
            <input type="number" id="weight" placeholder="Peso (kg)" value="70">
            <input type="number" id="chest" placeholder="Pecho (cm)">
            <input type="number" id="waist" placeholder="Cintura (cm)">
            <button class="btn" onclick="saveMeasurements()">Guardar Medidas</button>
            <p class="status" id="measurements-status"></p>
        </div>
    </div>

    <script>
        let userPhoto = localStorage.getItem('userPhoto');
        let garments = JSON.parse(localStorage.getItem('garments') || '[]');
        let measurements = JSON.parse(localStorage.getItem('measurements') || '{}');
        let selectedGarments = JSON.parse(localStorage.getItem('selectedGarments') || '{}');

        // Load saved data
        if (userPhoto) {
            document.getElementById('user-photo').src = userPhoto;
            document.getElementById('user-photo').style.display = 'block';
            document.getElementById('photo-status').textContent = '✓ Foto cargada';
            updatePreview();
        }

        if (Object.keys(measurements).length > 0) {
            document.getElementById('height').value = measurements.height || 170;
            document.getElementById('weight').value = measurements.weight || 70;
            document.getElementById('chest').value = measurements.chest || '';
            document.getElementById('waist').value = measurements.waist || '';
            document.getElementById('measurements-status').textContent = '✓ Medidas guardadas';
        }

        renderWardrobe();
        renderSelectedGarments();

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('[id$="-tab"]').forEach(t => t.classList.add('hidden'));
            document.getElementById(tab + '-tab').classList.remove('hidden');
            event.target.classList.add('active');
        }

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    userPhoto = e.target.result;
                    localStorage.setItem('userPhoto', userPhoto);
                    document.getElementById('user-photo').src = userPhoto;
                    document.getElementById('user-photo').style.display = 'block';
                    document.getElementById('photo-status').textContent = '✓ Foto cargada';
                    updatePreview();
                }
                reader.readAsDataURL(file);
            }
        }

        function addGarment() {
            const name = document.getElementById('garment-name').value;
            const bodyPart = document.getElementById('garment-body').value;
            const fileInput = document.getElementById('garment-image');
            
            if (!name || !bodyPart || !fileInput.files[0]) {
                alert('Completa todos los campos');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const garment = {
                    id: Date.now(),
                    name: name,
                    bodyPart: bodyPart,
                    imageUri: e.target.result
                };
                garments.push(garment);
                localStorage.setItem('garments', JSON.stringify(garments));
                renderWardrobe();
                
                // Clear inputs
                document.getElementById('garment-name').value = '';
                document.getElementById('garment-body').value = '';
                fileInput.value = '';
            }
            reader.readAsDataURL(fileInput.files[0]);
        }

        function renderWardrobe() {
            const list = document.getElementById('wardrobe-list');
            list.innerHTML = '';
            garments.forEach(g => {
                const div = document.createElement('div');
                div.className = 'garment-item';
                div.innerHTML = `
                    <img src="${g.imageUri}" style="width:80px;height:80px;object-fit:cover;border-radius:5px;"><br>
                    <small>${g.name}</small><br>
                    <button onclick="selectGarment(${g.id})" style="background:#007AFF;color:white;border:none;padding:5px 10px;border-radius:5px;margin-top:5px;">Probar</button>
                `;
                list.appendChild(div);
            });
        }

        function selectGarment(id) {
            const garment = garments.find(g => g.id === id);
            if (garment) {
                selectedGarments[garment.bodyPart] = garment;
                localStorage.setItem('selectedGarments', JSON.stringify(selectedGarments));
                renderSelectedGarments();
                updatePreview();
            }
        }

        function renderSelectedGarments() {
            const list = document.getElementById('garment-list');
            list.innerHTML = '';
            Object.values(selectedGarments).forEach(g => {
                const div = document.createElement('div');
                div.className = 'garment-item';
                div.innerHTML = `<small>${g.bodyPart}: ${g.name}</small>`;
                list.appendChild(div);
            });
        }

        function updatePreview() {
            const preview = document.getElementById('preview');
            if (userPhoto) {
                preview.innerHTML = `<img src="${userPhoto}" style="width:100%;height:100%;object-fit:contain;">`;
                
                // Add garment overlays
                Object.values(selectedGarments).forEach(g => {
                    const img = document.createElement('img');
                    img.src = g.imageUri;
                    img.style.cssText = 'position:absolute;width:60%;opacity:0.8;';
                    if (g.bodyPart === 'torso') img.style.top = '25%';
                    if (g.bodyPart === 'piernas') img.style.top = '50%';
                    if (g.bodyPart === 'pies') img.style.top = '75%';
                    preview.appendChild(img);
                });
            }
        }

        function saveMeasurements() {
            measurements = {
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                chest: document.getElementById('chest').value,
                waist: document.getElementById('waist').value
            };
            localStorage.setItem('measurements', JSON.stringify(measurements));
            document.getElementById('measurements-status').textContent = '✓ Medidas guardadas';
            updatePreview();
        }
    </script>
</body>
</html>
